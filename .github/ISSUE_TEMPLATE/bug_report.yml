name: Bug report
description: Report a reproducible problem with the live port or local tooling.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not attach original or private reference files.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chromium 140, Firefox 142, Safari 18
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us what you clicked or pressed and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
