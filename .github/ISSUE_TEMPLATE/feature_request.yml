name: Feature request
description: Suggest a focused improvement that respects the preservation scope.
title: "idea: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The port prioritizes fidelity to the authored game. Explain how the proposal fits that scope or why it should be an explicitly separate enhancement.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      placeholder: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      placeholder: What problem would this solve?
    validations:
      required: true
